<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- علامة إثبات الملكية لـ Google Search Console -->
    <meta name="google-site-verification" content="zAHADt6CMM6TaQ_Ab1fJcb1uEacPGCWXtTTSjv7egwE" />

    <title>GOSAT PLUS - سيرفر جوسات بلس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b1120;
            --card-bg: #131d31;
            --card-border: #1e2d4a;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
            --badge-blue: #1d9bf0;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-white); padding-bottom: 30px; min-height: 100vh; }

        header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 990;
            background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 12px 8px 12px;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .header-title-container {
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px;
        }

        .header-dish-icon {
            font-size: 1.3rem; color: var(--accent-gold);
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4));
            animation: floatDish 4s ease-in-out infinite;
        }

        @keyframes floatDish {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(-6deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        header h1 { font-size: 1.25rem; font-weight: 800; color: var(--text-white); display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
        
        .verified-badge {
            color: var(--badge-blue);
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 5px rgba(29, 155, 240, 0.5));
            animation: verifiedPulse 3s ease-in-out infinite;
        }

        @keyframes verifiedPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(29, 155, 240, 0.4)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 8px rgba(29, 155, 240, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(29, 155, 240, 0.4)); }
        }

        .header-services-row {
            display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 2px;
            font-size: 0.72rem; font-weight: 700; color: var(--text-gray);
        }

        .header-services-row span {
            color: var(--accent-gold);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .header-services-row .dot-separator {
            color: var(--card-border);
            font-size: 0.5rem;
        }

        .container { max-width: 520px; margin: 0 auto; padding: 0 10px; }

        .date-banner {
            text-align: center; background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 10px; padding: 8px 10px; margin: 12px 0; user-select: none;
        }
        .date-banner h3 { color: var(--accent-gold); font-size: 0.95rem; }
        .date-banner p { color: var(--text-gray); font-size: 0.75rem; }

        .match-card-item {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 10px 12px; margin-bottom: 10px; cursor: pointer; transition: transform 0.2s;
        }
        .match-card-item:hover { transform: translateY(-2px); border-color: var(--accent-blue); }

        .match-card-tournament {
            text-align: center; font-size: 0.75rem; color: var(--accent-gold); font-weight: 700;
            background: rgba(245, 158, 11, 0.1); padding: 1px 8px; border-radius: 8px; display: inline-block; margin-bottom: 6px;
        }

        .teams-vs-box { display: flex; align-items: center; justify-content: space-around; width: 100%; }
        .team-item { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 38%; }
        
        .team-logo-circle {
            width: 44px; height: 44px; border-radius: 50%; background: #1e293b; border: 1.5px solid var(--accent-blue);
            display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;
        }
        .team-logo-circle img {
            max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain;
        }
        .team-name { font-size: 0.8rem; font-weight: 700; text-align: center; }

        .time-box { text-align: center; }
        .match-time-badge {
            font-size: 0.75rem; font-weight: 800; color: var(--accent-green); background: rgba(16, 185, 129, 0.15);
            padding: 3px 9px; border-radius: 14px; border: 1px solid var(--accent-green);
        }

        .back-btn {
            background: #1e293b; color: var(--text-white); border: 1px solid var(--card-border);
            padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; margin-top: 10px;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .tabs-container {
            display: flex; justify-content: center; gap: 6px; margin: 10px 0; background: #111827;
            padding: 4px; border-radius: 10px; border: 1px solid var(--card-border);
        }
        .tab-btn {
            flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-gray);
            font-size: 0.85rem; font-weight: 700; border-radius: 6px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 6px; user-select: none;
        }
        .tab-btn.active { background: var(--accent-blue); color: var(--text-white); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .match-header-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 12px 10px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .match-top-info { text-align: center; margin-bottom: 8px; }
        .match-date-time { font-size: 0.75rem; color: var(--text-gray); display: flex; justify-content: center; gap: 10px; }

        .match-extra-details {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px;
            padding-top: 10px; border-top: 1px dashed var(--card-border);
        }
        .mini-detail-card { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 6px 4px; text-align: center; }
        .mini-detail-card i { font-size: 0.8rem; margin-bottom: 2px; display: block; }
        .mini-detail-card .title { font-size: 0.65rem; color: var(--text-gray); }
        .mini-detail-card .val { font-size: 0.75rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .sat-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px;
            overflow: hidden; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }
        .media-box-16-9 { width: 100%; aspect-ratio: 16 / 9; background: #0f172a; overflow: hidden; display: flex; align-items: center; justify-content: center; border-radius: 12px 12px 0 0; }
        .media-box-16-9 img { width: 100%; height: 100%; object-fit: cover; }
        
        .channel-name-banner, .card-header {
            padding: 9px 12px; font-size: 0.88rem; font-weight: 800; color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.02); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none;
        }
        .channel-title { display: flex; align-items: center; gap: 10px; }
        
        /* تنسيق صندوق لوجو القناة ليكون محتوياً للشعار كاملاً دون قص */
        .logo-box {
            width: 52px; height: 52px; background: #0f172a; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid var(--card-border); flex-shrink: 0; padding: 4px;
        }
        .logo-box img {
            max-width: 100%; max-height: 100%; width: auto; height: auto;
            object-fit: contain; object-position: center; border-radius: 6px;
        }
        
        .arrow-icon { color: var(--text-gray); font-size: 0.8rem; transition: transform 0.3s; }
        .arrow-icon.open { transform: rotate(180deg); }

        .card-body { padding: 10px 12px; display: none; flex-direction: column; gap: 8px; border-top: 1px solid var(--card-border); }
        .card-body.active { display: flex; }
        
        .info-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
        .info-label { color: var(--text-gray); display: flex; align-items: center; gap: 6px; }
        .info-value { font-weight: 700; }
        .icon-badge { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }
        .icon-blue { background: rgba(37, 99, 235, 0.15); color: #60a5fa; }
        .icon-green { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .icon-gold { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); }
        .val-green { color: var(--accent-green); }
        .val-gold { color: var(--accent-gold); }

        .same-timeshift-receivers-box { background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; }
        .same-timeshift-title { font-size: 0.75rem; color: var(--accent-gold); font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
        .receivers-tags { display: flex; flex-wrap: wrap; gap: 4px; }
        .receiver-tag { background: #1e293b; border: 1px solid var(--card-border); color: var(--text-white); font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="header-title-container">
            <i class="fa-solid fa-satellite-dish header-dish-icon"></i>
            <h1>
                GOSAT PLUS
                <i class="fa-solid fa-circle-check verified-badge" title="حساب موثق"></i>
            </h1>
        </div>
        <div class="header-services-row">
            <span>شيرنج</span>
            <i class="fa-solid fa-circle dot-separator"></i>
            <span>صوتيات</span>
            <i class="fa-solid fa-circle dot-separator"></i>
            <span>ترجمة</span>
        </div>
    </header>

    <div class="container">
        <!-- البوابة الرئيسية -->
        <div id="home-view">
            <div class="date-banner">
                <h3 id="disp-today-date">جاري تحميل البيانات...</h3>
                <p>مباريات اليوم - اضغط على مباراة لعرض القنوات والتايم شيفت</p>
            </div>
            <div id="matches-list-container"></div>
        </div>

        <!-- شاشة تفاصيل المباراة -->
        <div id="details-view" style="display: none;">
            <button class="back-btn" onclick="showHomeView(true)">
                <i class="fa-solid fa-arrow-right"></i> العودة لقائمة المباريات
            </button>

            <div class="tabs-container">
                <button class="tab-btn active" id="tab-btn-channels" onclick="switchTab('channels-tab', this)">
                    <i class="fa-solid fa-tv"></i> القنوات الناقلة
                </button>
                <button class="tab-btn" id="tab-btn-timeshift" onclick="switchTab('timeshift-tab', this)">
                    <i class="fa-solid fa-clock-rotate-left"></i> تايم شيفت
                </button>
            </div>

            <!-- القنوات الناقلة -->
            <div id="channels-tab" class="tab-content active">
                <div class="match-header-card" id="detail-match-header-ch"></div>
                <div id="channels-cards-container"></div>
            </div>

            <!-- التايم شيفت -->
            <div id="timeshift-tab" class="tab-content">
                <div class="match-header-card" id="detail-match-header-ts"></div>
                <div id="timeshift-cards-container"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (وضع القراءة المباشرة فقط) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_CKgSs7ajVzcCdJyqLQfqrXPl7DjJPo0",
            authDomain: "gosat-plus-2.firebaseapp.com",
            projectId: "gosat-plus-2",
            storageBucket: "gosat-plus-2.firebasestorage.app",
            messagingSenderId: "811325857294",
            appId: "1:811325857294:web:19bc8af8d43b3cfa17a65f",
            measurementId: "G-M9WYVYD00G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.todayDateText = "الأربعاء، 12 أغسطس 2026";
        window.activeMatchId = null;
        window.matchesData = [];

        const docRef = doc(db, "gosat_data", "main_data");

        onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                window.todayDateText = data.todayDateText || "الأربعاء، 12 أغسطس 2026";
                window.matchesData = data.matchesData || [];
            }
            renderMatchesList();
            if (window.activeMatchId) renderMatchDetails();
        }, (error) => {
            console.log("Firebase Read Error:", error);
            renderMatchesList();
        });
    </script>

    <script>
        window.addEventListener('popstate', function(event) {
            showHomeView(false);
        });

        function showHomeView(useHistory = true) {
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('details-view').style.display = 'none';
            window.activeMatchId = null;
            renderMatchesList();

            if (useHistory && history.state && history.state.page === 'details') {
                history.back();
            }
        }

        function openMatchDetails(matchId) {
            window.activeMatchId = matchId;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('details-view').style.display = 'block';
            renderMatchDetails();

            history.pushState({ page: 'details', matchId: matchId }, '', '#match-' + matchId);
        }

        function renderMatchesList() {
            document.getElementById('disp-today-date').innerText = window.todayDateText;
            const container = document.getElementById('matches-list-container');
            container.innerHTML = window.matchesData.map(m => `
                <div class="match-card-item" onclick="openMatchDetails(${m.id})">
                    <div style="text-align:center;">
                        <span class="match-card-tournament">${m.tournament || 'مباراة اليوم'}</span>
                    </div>
                    <div class="teams-vs-box">
                        <div class="team-item">
                            <div class="team-logo-circle"><img src="${m.t1Img || 'https://via.placeholder.com/60?text=T1'}" alt="${m.t1Name || 'الفريق 1'}"></div>
                            <div class="team-name">${m.t1Name || 'الفريق 1'}</div>
                        </div>
                        <div class="time-box">
                            <div class="match-time-badge">${m.time || '00:00'}</div>
                        </div>
                        <div class="team-item">
                            <div class="team-logo-circle"><img src="${m.t2Img || 'https://via.placeholder.com/60?text=T2'}" alt="${m.t2Name || 'الفريق 2'}"></div>
                            <div class="team-name">${m.t2Name || 'الفريق 2'}</div>
                        </div>
                    </div>
                </div>
            `).join('') || '<div style="text-align:center; padding:15px; color:var(--text-gray); font-size:0.85rem;">لا توجد مباريات مضافة اليوم</div>';
        }

        function renderMatchDetails() {
            const m = window.matchesData.find(item => item.id === window.activeMatchId);
            if (!m) return;

            const headerHtml = `
                <div class="match-top-info">
                    <div class="match-tournament" style="color:var(--accent-gold); font-weight:700; font-size:0.85rem; margin-bottom:4px;">${m.tournament || 'مباراة اليوم'}</div>
                    <div class="match-date-time">
                        <span><i class="fa-regular fa-calendar"></i> ${window.todayDateText}</span>
                        <span><i class="fa-regular fa-clock"></i> ${m.time || '00:00'}</span>
                    </div>
                </div>
                <div class="teams-vs-box">
                    <div class="team-item"><div class="team-logo-circle"><img src="${m.t1Img || 'https://via.placeholder.com/60?text=T1'}"></div><div class="team-name">${m.t1Name || 'الفريق 1'}</div></div>
                    <div style="font-weight:800; color:var(--accent-red); font-size:0.85rem;">VS</div>
                    <div class="team-item"><div class="team-logo-circle"><img src="${m.t2Img || 'https://via.placeholder.com/60?text=T2'}"></div><div class="team-name">${m.t2Name || 'الفريق 2'}</div></div>
                </div>
                <div class="match-extra-details">
                    <div class="mini-detail-card"><i class="fa-solid fa-microphone" style="color:var(--accent-blue);"></i><div class="title">المعلق</div><div class="val">${m.comm || 'غير محدد'}</div></div>
                    <div class="mini-detail-card"><i class="fa-solid fa-tv" style="color:var(--accent-green);"></i><div class="title">القناة الناقلة</div><div class="val">${m.mainChannel || 'غير محدد'}</div></div>
                    <div class="mini-detail-card"><i class="fa-solid fa-sliders" style="color:var(--accent-gold);"></i><div class="title">القناة الصوتية</div><div class="val" style="color:var(--accent-gold);">${m.audioTrack || 'غير محدد'}</div></div>
                </div>
            `;

            document.getElementById('detail-match-header-ch').innerHTML = headerHtml;
            document.getElementById('detail-match-header-ts').innerHTML = headerHtml;

            const chContainer = document.getElementById('channels-cards-container');
            chContainer.innerHTML = (m.channels || []).map(c => `
                <div class="sat-card">
                    <div class="card-header" onclick="toggleCard('ch-body-${c.id}', 'ch-arrow-${c.id}')">
                        <div class="channel-title">
                            <div class="logo-box"><img src="${c.img || 'https://via.placeholder.com/50?text=TV'}"></div>
                            <span>${c.name || 'قناة ناقلة'}</span>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon" id="ch-arrow-${c.id}"></i>
                    </div>
                    <div class="card-body" id="ch-body-${c.id}">
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-blue"><i class="fa-solid fa-satellite"></i></div>القمر :</div><div class="info-value">${c.sat || 'غير محدد'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-green"><i class="fa-solid fa-tower-broadcast"></i></div>التردد :</div><div class="info-value val-green">${c.freq || 'غير محدد'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-blue"><i class="fa-solid fa-arrows-up-down-left-right"></i></div>الاستقطاب :</div><div class="info-value">${c.polar || 'H'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-green"><i class="fa-solid fa-gauge-high"></i></div>معدل الترميز :</div><div class="info-value val-green">${c.rate || '27500'}</div></div>
                    </div>
                </div>
            `).join('') || '<div style="color:var(--text-gray); text-align:center; padding:12px; font-size:0.8rem;">لا توجد قنوات ناقلة مضافة لهذه المباراة</div>';

            const tsContainer = document.getElementById('timeshift-cards-container');
            tsContainer.innerHTML = (m.timeshifts || []).map(c => {
                const sameList = c.sameReceivers ? c.sameReceivers.split(',').map(r => `<span class="receiver-tag">${r.trim()}</span>`).join('') : '';
                return `
                <div class="sat-card">
                    <div class="media-box-16-9"><img src="${c.img || 'https://via.placeholder.com/600x337?text=16:9+Image'}"></div>
                    <div class="channel-name-banner" onclick="toggleCard('ts-body-${c.id}', 'ts-arrow-${c.id}')">
                        <span>${c.chName || 'قناة التايم شيفت'}</span>
                        <i class="fa-solid fa-chevron-down arrow-icon" id="ts-arrow-${c.id}"></i>
                    </div>
                    <div class="card-body" id="ts-body-${c.id}">
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-blue"><i class="fa-solid fa-satellite"></i></div>القمر :</div><div class="info-value">${c.sat || 'غير محدد'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-green"><i class="fa-solid fa-tower-broadcast"></i></div>التردد :</div><div class="info-value val-green">${c.freq || 'غير محدد'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-blue"><i class="fa-solid fa-arrows-up-down-left-right"></i></div>الاستقطاب :</div><div class="info-value">${c.polar || 'H'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-green"><i class="fa-solid fa-gauge-high"></i></div>معدل الترميز :</div><div class="info-value val-green">${c.rate || '27500'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-gold"><i class="fa-solid fa-sliders"></i></div>القناة الصوتية :</div><div class="info-value val-gold">${c.audio || 'غير محدد'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-green"><i class="fa-solid fa-hourglass-half"></i></div>التايم شيفت :</div><div class="info-value val-green">${c.delay || '0'} ثانية</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-blue"><i class="fa-solid fa-microphone"></i></div>المعلق :</div><div class="info-value">${c.comm || 'غير محدد'}</div></div>
                        <div class="info-row"><div class="info-label"><div class="icon-badge icon-gold"><i class="fa-solid fa-tv"></i></div>اسم الريسيفر :</div><div class="info-value val-gold">${c.receiver || 'غير محدد'}</div></div>
                    </div>
                </div>
                ${sameList ? `<div class="same-timeshift-receivers-box"><div class="same-timeshift-title"><i class="fa-solid fa-microchip"></i> ريسيفرات تحمل نفس التايم شيفت:</div><div class="receivers-tags">${sameList}</div></div>` : ''}
            `}).join('') || '<div style="color:var(--text-gray); text-align:center; padding:12px; font-size:0.8rem;">لا يوجد تايم شيفت مضاف لهذه المباراة</div>';
        }

        function toggleCard(bodyId, arrowId) {
            const cardBody = document.getElementById(bodyId);
            const arrowIcon = document.getElementById(arrowId);
            if(cardBody) cardBody.classList.toggle('active');
            if(arrowIcon) arrowIcon.classList.toggle('open');
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        showHomeView(false);
    </script>
</body>
</html>
